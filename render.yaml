services:
  - type: web
    name: flippy-studio-web
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: flippy-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/flippy.db
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: sandbox
